      <text x="987" y="166" font-size="13" fill="#7EABC9" letter-spacing="2">T-SQL INPUT</text>
      <text x="995" y="311" font-size="16" font-weight="700" fill="#97E3FF">METADATA</text>
      <text x="992" y="334" font-size="13" fill="#7EABC9" letter-spacing="1.7">DEPENDENCIES</text>
      <text x="1291" y="225" font-size="22" font-weight="700" fill="#D6C6FF">ORACLE</text>
      <text x="1291" y="253" font-size="14" fill="#B9A7EF" letter-spacing="2">PL/SQL · 12c+</text>
      <text x="69" y="61" font-size="15" letter-spacing="4" fill="#85A7C8">DATABASE ENGINEERING  /  02</text>
      <rect x="69" y="111" width="7" height="210" rx="3" fill="url(#accent)"/>
      <text x="103" y="189" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="1">ORACLE</text>
      <text x="103" y="275" font-size="68" font-weight="700" fill="url(#accent)" letter-spacing="1">MIGRATION</text>
      <text x="106" y="321" font-size="25" letter-spacing="4.4" fill="#D6E7FA">TOOLKIT</text>
      <text x="106" y="374" font-size="20" letter-spacing="1.3" fill="#A9B9D7">ASSESS  ·  PLAN  ·  RECONCILE  ·  VALIDATE</text>
      <text x="70" y="440" font-size="15" letter-spacing="2.3" fill="#8BA8CB">MELISSA CASTRO  /  DATA &amp; SQL ENGINEERING LAB</text>
      <text x="1331" y="438" font-size="14" letter-spacing="3" fill="#8BA1C5">MC // 02</text>
