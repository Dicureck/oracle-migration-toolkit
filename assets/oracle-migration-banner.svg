    <g fill="none" stroke="#AE97FF" stroke-width="3" stroke-opacity=".65">
      <path d="M1043 186H1160V230H1265"/>
      <path d="M1043 290H1160V248H1265"/>
    </g>
    <g fill="#0F203C" stroke="#7FD7FF" stroke-width="2">
