<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Oracle Migration Toolkit — Melissa Castro</title>
  <desc id="desc">Professional cyber-noir banner with electric cyan, violet and a visual graph of database migration dependencies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1A"/><stop offset="57%" stop-color="#101A34"/><stop offset="100%" stop-color="#17132C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4ADFFF"/><stop offset=".55" stop-color="#70A5FF"/><stop offset="1" stop-color="#B18CFF"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7157DB" stop-opacity=".32"/><stop offset="1" stop-color="#7157DB" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7A9FD7" stroke-opacity=".085" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="edge"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1600" height="480" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1600" height="480" fill="url(#bg)"/>
    <rect width="1600" height="480" fill="url(#grid)"/>
    <ellipse cx="1280" cy="200" rx="400" ry="330" fill="url(#glow)"/>
    <path d="M0 100H1600M0 389H1600" stroke="#67C7FF" stroke-opacity=".15"/>
    <g fill="none" stroke="#6FC9FF" stroke-width="2" stroke-opacity=".52">
